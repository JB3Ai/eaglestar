name: Build & Deploy to cPanel

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: "cpanel-deploy"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: |
          npm run clean
          npm run build

      - name: Deploy to cPanel via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_HOST }}
          port: 21
          protocol: ftps
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ./public_html/
          dangerous-clean-slate: true
          log-level: verbose

  verify-live-site:
    runs-on: ubuntu-latest
    needs: build-and-deploy
    steps:
      - name: Wait 30 minutes for propagation
        run: sleep 1800

      - name: Check live homepage
        run: |
          response=$(curl -L --silent --show-error --write-out "\nHTTP_STATUS:%{http_code}" https://www.eaglestar.co.za/)
          echo "$response"
          echo "$response" | grep -q "HTTP_STATUS:200"
          echo "$response" | grep -q "Eagle Star Security"
